{% extends "base.html" %}

{% block title %}
Assign Trek
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Assign Trek</h1>

    <form method="POST" class="main-form">

        <label>Select Trek</label>

        <select name="trek_id">

            {% for trek in treks %}

            <option value="{{ trek.id }}">
                {{ trek.name }}
            </option>

            {% endfor %}

        </select>

        <button type="submit">
            Assign
        </button>

    </form>

</div>

{% endblock %}
