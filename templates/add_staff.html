{% extends "base.html" %}

{% block title %}
Add Staff
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Add Staff</h1>

    <form method="POST" class="main-form">

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">
            Add Staff
        </button>

    </form>

</div>

{% endblock %}
